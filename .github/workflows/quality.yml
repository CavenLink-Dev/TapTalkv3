name: quality
on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint (max-lines guardrail)
        run: npx eslint . --max-warnings 0
      - name: Jest
        run: npx jest --coverage
      - name: God-screen guardrail
        run: |
          for f in $(find src app -type f \( -name '*.ts' -o -name '*.tsx' \) \
              -not -path '*/node_modules/*' \
              -not -name '*.generated.ts' \
              -not -path '*/symbolPacks.ts'); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 700 ]; then
              echo "::error file=$f::$f has $lines lines (limit 700)"
              exit 1
            fi
          done
